# 不分离部署（server.mode: all）：所有请求反向代理到 Gvboard
# 用户端、管理端（/{安全路径}/）、API、节点接口、订阅地址都由 Gvboard 提供。

# 可选：按 IP 限制请求频率（本文件放在 conf.d 下时位于 http 块中；节点与订阅请求也计入，按需调整）
# limit_req_zone $binary_remote_addr zone=gvb:10m rate=20r/s;

# 可选：访问日志不记录查询串（订阅 token 在查询串中）
# log_format gvb_noquery '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 80;
    server_name panel.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name panel.example.com;

    ssl_certificate     /etc/nginx/ssl/panel.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/panel.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 不暴露 Nginx 版本
    server_tokens off;
    # 插件安装包最大 2 MB，其余请求体上限由 server.max_body_bytes 控制
    client_max_body_size 8m;
    # 可选：确认 HTTPS 正常后再启用
    # add_header Strict-Transport-Security "max-age=31536000" always;
    # access_log /var/log/nginx/panel.access.log gvb_noquery;

    location / {
        # limit_req zone=gvb burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Gvboard 只信任 server.trusted_proxies 中的地址传来的客户端 IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
