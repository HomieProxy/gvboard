# 分离部署（server.mode: api）：API 与两个前端分别使用不同域名
#   api.example.com   → Gvboard（API、节点接口、订阅地址、支付回调）
#   www.example.com   → 用户端静态文件（internal/theme/builtin/default 中除 theme.json 外的文件 + config.js）
#   admin.example.com → 管理端静态文件（internal/web/admin 中的文件 + config.js）
# Gvboard 配置：server.mode: api；cors.allow_origins: ["https://www.example.com", "https://admin.example.com"]

server {
    listen 80;
    server_name api.example.com www.example.com admin.example.com;
    return 301 https://$host$request_uri;
}

# ---------- API ----------
server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;
    ssl_certificate     /etc/nginx/ssl/api.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/api.example.com.key;
    server_tokens off;
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}

# ---------- 用户端 ----------
server {
    listen 443 ssl;
    http2 on;
    server_name www.example.com;
    ssl_certificate     /etc/nginx/ssl/www.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/www.example.com.key;
    server_tokens off;

    root /var/www/gvboard-user;
    index index.html;

    # 页面地址使用 # 形式，不需要回退到 index.html；不存在的文件返回 404
    location / {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    # 带内容哈希的资源长期缓存
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /config.js {
        add_header Cache-Control "no-store";
    }
    location = /theme.json { return 404; }
}

# ---------- 管理端 ----------
# config.js 中包含管理端安全路径，建议限制访问来源或加 HTTP 认证
server {
    listen 443 ssl;
    http2 on;
    server_name admin.example.com;
    ssl_certificate     /etc/nginx/ssl/admin.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/admin.example.com.key;
    server_tokens off;

    # allow 203.0.113.10;
    # deny all;
    # auth_basic "Restricted";
    # auth_basic_user_file /etc/nginx/gvboard-admin.htpasswd;

    root /var/www/gvboard-admin;
    index index.html;

    location / {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
