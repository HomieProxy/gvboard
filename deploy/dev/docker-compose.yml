# 仅用于本机开发与集成测试，端口只绑定 127.0.0.1，密码不得用于生产。
name: gvboard-dev

services:
  mysql57:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: gvb_dev_pass
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:33057:3306"
    volumes:
      - mysql57:/var/lib/mysql

  mysql80:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: gvb_dev_pass
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:33080:3306"
    volumes:
      - mysql80:/var/lib/mysql

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: gvb_dev_pass
    ports:
      - "127.0.0.1:54316:5432"
    volumes:
      - postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:63790:6379"

volumes:
  mysql57:
  mysql80:
  postgres:
